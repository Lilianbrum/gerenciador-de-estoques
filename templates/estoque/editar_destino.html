{% extends "estoque/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Editar destino</h1>
            <p class="text-muted mb-0">
                Altere os dados do destino abaixo.
            </p>
        </div>

        <a href="{% url 'destinos' %}" class="btn btn-secondary">
            Voltar
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                    <a href="{% url 'destinos' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
